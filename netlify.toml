[build]
  command = "echo Build skipped - using pre-built files"
  publish = "build"

[[redirects]]
  from = "/epub-proxy/archive/*"
  to = "https://archive.org/download/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/epub-proxy/gutenberg/*"
  to = "https://www.gutenberg.org/cache/epub/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
